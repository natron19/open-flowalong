# GRADE Goal: turn a workshop brief into a timed Markdown agenda a first-time facilitator
# can run as-is. "Good" = 4-8 sections of 5-30 min that add up to exactly the requested
# duration, opening with Welcome and Framing and closing with Reflection and Next Steps.
# Top concerns: activities fit the audience and lead to the desired outcome; timing is
# realistic (the #1 known failure mode is sections not summing to duration_minutes).
template: flowalong_agenda_v1

rubric:
  - dimension: useful
    criterion: Every activity fits the stated audience and visibly moves the group toward the desired outcome.
  - dimension: useful
    criterion: Timing is realistic. Each activity can actually be completed in its allotted minutes, and the agenda favors doing over presenting.
  - dimension: accurate
    criterion: The agenda is grounded in the brief and honors any additional notes the author gave.

# Output is Markdown, not JSON, so sum_equals cannot run. The sum is approximated by
# checking that the last section's start time plus its length equals duration_minutes
# (the "ends_at" regex below, generated per duration). It does not catch start times
# that drift from the section lengths in the middle of the agenda.
cases:
  - id: golden_retro_90
    kind: golden
    segment: team_lead
    variables:
      topic: "Running Effective Retrospectives"
      audience: "Software engineering teams and their managers"
      duration_minutes: 90
      desired_outcome: "Teams leave with a specific format they can use immediately and three agreements about how to run their retros going forward"
      notes: "Additional Notes: Participants may be skeptical about retros. Acknowledge that bad retros are common."
    checks:
      - { type: not_empty }
      - { type: matches, pattern: '\A\s*## 0?0:00 - Welcome and Framing \(' }
      - { type: matches, pattern: '^## [^\n]*Reflection and Next Steps \(\d+ min\)[^\n]*$(?![\s\S]*^## )' }
      - type: matches
        # 4 to 8 sections, each 5 to 30 minutes
        pattern: '\A(?:(?!^## )[\s\S])*(?:^## [^\n]*\((?:[5-9]|[12]\d|30) min\)[^\n]*\n(?:(?!^## )[\s\S])*){4,8}\z'
      - type: matches
        # every section has a Facilitator Note and an Activity
        pattern: '\A(?:(?!^## )[\s\S])*(?:^## [^\n]*\n(?:(?!^## |\*\*Facilitator Note:\*\*)[\s\S])*\*\*Facilitator Note:\*\*(?:(?!^## |\*\*Activity:\*\*)[\s\S])*\*\*Activity:\*\*(?:(?!^## )[\s\S])*)+\z'
      - type: matches
        dimension: accurate
        # proxy for "durations sum to 90": the last section's start + length == 90
        pattern: '^## (?:(?:01:25|01:25:00|1:25|1:25:00|85:00) - [^\n]*\(5 min\)|(?:01:24|01:24:00|1:24|1:24:00|84:00) - [^\n]*\(6 min\)|(?:01:23|01:23:00|1:23|1:23:00|83:00) - [^\n]*\(7 min\)|(?:01:22|01:22:00|1:22|1:22:00|82:00) - [^\n]*\(8 min\)|(?:01:21|01:21:00|1:21|1:21:00|81:00) - [^\n]*\(9 min\)|(?:01:20|01:20:00|1:20|1:20:00|80:00) - [^\n]*\(10 min\)|(?:01:19|01:19:00|1:19|1:19:00|79:00) - [^\n]*\(11 min\)|(?:01:18|01:18:00|1:18|1:18:00|78:00) - [^\n]*\(12 min\)|(?:01:17|01:17:00|1:17|1:17:00|77:00) - [^\n]*\(13 min\)|(?:01:16|01:16:00|1:16|1:16:00|76:00) - [^\n]*\(14 min\)|(?:01:15|01:15:00|1:15|1:15:00|75:00) - [^\n]*\(15 min\)|(?:01:14|01:14:00|1:14|1:14:00|74:00) - [^\n]*\(16 min\)|(?:01:13|01:13:00|1:13|1:13:00|73:00) - [^\n]*\(17 min\)|(?:01:12|01:12:00|1:12|1:12:00|72:00) - [^\n]*\(18 min\)|(?:01:11|01:11:00|1:11|1:11:00|71:00) - [^\n]*\(19 min\)|(?:01:10|01:10:00|1:10|1:10:00|70:00) - [^\n]*\(20 min\)|(?:01:09|01:09:00|1:09|1:09:00|69:00) - [^\n]*\(21 min\)|(?:01:08|01:08:00|1:08|1:08:00|68:00) - [^\n]*\(22 min\)|(?:01:07|01:07:00|1:07|1:07:00|67:00) - [^\n]*\(23 min\)|(?:01:06|01:06:00|1:06|1:06:00|66:00) - [^\n]*\(24 min\)|(?:01:05|01:05:00|1:05|1:05:00|65:00) - [^\n]*\(25 min\)|(?:01:04|01:04:00|1:04|1:04:00|64:00) - [^\n]*\(26 min\)|(?:01:03|01:03:00|1:03|1:03:00|63:00) - [^\n]*\(27 min\)|(?:01:02|01:02:00|1:02|1:02:00|62:00) - [^\n]*\(28 min\)|(?:01:01|01:01:00|1:01|1:01:00|61:00) - [^\n]*\(29 min\)|(?:00:01|00:01:00|01:00|01:00:00|0:01|0:01:00|1:00|1:00:00|60:00) - [^\n]*\(30 min\))[^\n]*$(?![\s\S]*^## )'
